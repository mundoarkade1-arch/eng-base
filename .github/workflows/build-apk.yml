name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Conferir se o APK existe
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -f "$APK"
          cp "$APK" EngBase.apk
          ls -l EngBase.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eng base - build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            Versão do app: 0.1.0
          files: EngBase.apk
