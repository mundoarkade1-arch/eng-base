name: Gerar chave

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Não gerar outra chave se já existe
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "Já existe uma chave cadastrada. Não vou gerar outra."
            exit 1
          fi

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar a chave
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore engbase.jks -alias engbase \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Eng base, O=Eng base, C=BR"
          base64 -w0 engbase.jks > KEYSTORE_BASE64.txt
          printf "%s" "$PASS" > KEY_PASSWORD.txt

      - name: Guardar por 1 dia para você baixar
        uses: actions/upload-artifact@v4
        with:
          name: chave-engbase
          path: |
            KEYSTORE_BASE64.txt
            KEY_PASSWORD.txt
            engbase.jks
          retention-days: 1
